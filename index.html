<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.json">
<title>SAC - Acciones Correctivas</title>
<style>
:root{--bg:#f2f4f8;--card:#fff;--tx:#1b2430;--mut:#6b7686;--pri:#1f3a5f;--acc:#e8702a;--ok:#2e9e5b;--warn:#e0a100;--bad:#d64545;--bd:#dde2ea}
@media(prefers-color-scheme:dark){:root{--bg:#10151c;--card:#1a222d;--tx:#e8edf3;--mut:#93a0b3;--pri:#6fa0dc;--bd:#2b3646}}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:72px}
header{background:#1f3a5f;color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px}
header h1{font-size:16px;margin:0;flex:1;text-align:center}
.lg{height:40px;width:40px;border-radius:50%;object-fit:contain;flex-shrink:0}
.cl{width:auto;min-width:40px;max-width:84px;border-radius:8px;background:rgba(255,255,255,.12);border:1px dashed rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;cursor:pointer;margin:0;color:#fff;font-size:10px;line-height:1.1;text-align:center;padding:2px 4px}
.cl img{height:36px;max-width:76px;object-fit:contain;background:#fff;border-radius:6px;padding:2px}
.cl.has{border:0;background:none}
.bell{order:3}.cl{order:4}header small{opacity:.8;display:block;font-weight:400;font-size:12px}
.bell{position:relative;background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
.bell b{position:absolute;top:-4px;right:-6px;background:var(--bad);border-radius:10px;font-size:11px;padding:1px 5px}
main{padding:12px;max-width:900px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:9px 2px;font-size:11px;cursor:pointer}nav button span{display:block;font-size:20px}
nav button.on{color:var(--pri);font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px;font-weight:600}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:80px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.acc{background:var(--acc)}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.ghost{background:none;color:var(--pri);border:1px solid var(--bd)}
.btn.full{width:100%;margin-top:10px}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600;color:#fff}
.s-Abierta{background:var(--bad)}.s-En\ curso{background:var(--warn)}.s-Cerrada{background:#3b82c4}.s-Verificada{background:var(--ok)}
.p1{border-left:5px solid var(--bad)}.p2{border-left:5px solid var(--warn)}.p3{border-left:5px solid var(--ok)}
.item{cursor:pointer}.item h3{margin:0 0 4px;font-size:15px}.meta{color:var(--mut);font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}.kpi b{font-size:28px;display:block}.kpi span{font-size:12px;color:var(--mut)}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}.bar i{display:block;height:14px;border-radius:4px;background:var(--pri);min-width:2px}.bar em{width:110px;font-style:normal;flex-shrink:0}
.chips{display:flex;gap:6px;overflow:auto;padding-bottom:6px;margin-bottom:6px}.chips button{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:6px 12px;cursor:pointer}.chips button.on{background:var(--pri);color:#fff}
.segt{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 14px}.segt th{text-align:left;color:var(--mut);font-weight:600;font-size:11px}.segt td,.segt th{padding:4px 6px;border-bottom:1px solid var(--bd)}.segt .c{text-align:center}.sb{height:7px;background:var(--bd);border-radius:4px;margin:2px 0;overflow:hidden}.sb i{display:block;height:100%;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.opts2{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px;border-radius:12px}.opt2{border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 16px;font-weight:600;font-size:15px;cursor:pointer;min-width:64px}.opt2.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tl{border-left:2px solid var(--bd);margin-left:6px;padding-left:12px}.tl div{margin:6px 0;font-size:13px}
.hide{display:none}img.ph{max-width:100%;border-radius:8px;margin-top:6px}
.toast{position:fixed;top:64px;left:12px;right:12px;background:#1f3a5f;color:#fff;border-radius:10px;padding:12px;z-index:9}
.big{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.rh{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:3px solid var(--acc);padding-bottom:8px;margin-bottom:8px;text-align:center}.rh img{height:56px;max-width:110px;object-fit:contain}
.gal{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.gal img{width:calc(33.3% - 4px);aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:zoom-in}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:20;display:flex;align-items:center;justify-content:center}.lb img{max-width:96%;max-height:96%}
.rh.pr-only{display:none}.sc{overflow-x:auto}.sc svg{display:block}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin:4px 0 6px}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.bar i{background:linear-gradient(90deg,var(--pri),var(--acc))}
.ct{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}.ct b{font-size:15px}.ct span{font-size:12px;color:var(--mut)}
.chip{display:inline-block;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:700;color:#fff}
.card{border:2px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,#e8702a,#3b82c4) border-box;box-shadow:0 6px 16px rgba(31,58,95,.14),0 1px 0 rgba(255,255,255,.5) inset}
.kpi{border:2px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,#3b82c4,#e8702a) border-box;box-shadow:0 5px 12px rgba(31,58,95,.16);position:relative;overflow:hidden}.kpi:before{content:'';position:absolute;left:0;right:0;top:0;height:42%;background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,0))}.kpi b{text-shadow:1px 2px 2px rgba(0,0,0,.18)}
.bar i{height:16px;border-radius:5px;background:linear-gradient(180deg,#ffa066,#e8702a 55%,#b3501a);box-shadow:0 3px 5px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.4),inset 0 -3px 0 rgba(0,0,0,.18)}
.tag,.chip{box-shadow:0 2px 4px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.4);text-shadow:0 1px 1px rgba(0,0,0,.3)}
.btn{box-shadow:0 3px 6px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.3)}.leg i{border-radius:3px;box-shadow:1px 2px 3px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.5)}
.rh{border-bottom:3px solid transparent;border-image:linear-gradient(90deg,#e8702a,#3b82c4) 1}
.card.p1{border-left:7px solid var(--bad)}.card.p2{border-left:7px solid var(--warn)}.card.p3{border-left:7px solid var(--ok)}
@media print{:root{--bg:#fff;--card:#fff;--tx:#111;--mut:#555;--pri:#1f3a5f;--bd:#ccc}header,nav,.noprint{display:none!important}body{background:#fff;color:#000;padding:0}.card,.kpi{break-inside:avoid}.rh.pr-only{display:flex}.sc{overflow:visible}.sc svg{min-width:0!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}.gal img{width:31%}}
</style>
</head>

<main id="app"></main>
<nav id="nav"></nav>
<script>
// ===== Datos =====
const AREAS=['Mantenimiento','QC','Operaciones','Seguridad','Administración','Gerencia','Senacsa','Otros'];
const TIPOS=['Electricidad','Mecánica','Refrigeración','Civil','Otros Servicios'];
const PRIO={1:{t:'1 · Urgente (1-2 días)',d:2},2:{t:'2 · Normal (3-15 días)',d:15},3:{t:'3 · Programable (16-60 días)',d:60}};
const K='sac_v1';
// Interruptor: false = no se pueden generar SAC nuevas (poner true para reactivar)
const SAC_NUEVAS=false;
const SERVER='https://script.google.com/macros/s/AKfycbwQe6bv-fOp31vdA8A9voOchim8LtE0E9se9UvTVEEen12hw_FleZVQcdY3HY5zF-6a/exec';
let S=load();
function load(){try{const s=JSON.parse(localStorage.getItem(K));if(s){if(!s.url)s.url=SERVER;if(!s.queue)s.queue=[];return s}}catch(e){}return{user:{nombre:'',email:'',area:'',rol:'tecnico',planta:''},url:SERVER,queue:[],plantas:['Planta 1'],sacs:[],notifs:[],seq:0}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Memoria llena: reduce fotos')}}
const $=s=>document.querySelector(s);const hoy=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const dias=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500)}
function vencida(s){return s.estado!=='Verificada'&&s.estado!=='Cerrada'&&hoy()>s.fechaLimite}
// ===== Navegación =====
let view='list',cur=null,filtro='Todas';
const NAVS={tecnico:[['list','📋','Mis SAC'],['new','➕','Nueva'],['notif','🔔','Avisos'],['cfg','⚙️','Perfil']],
supervisor:[['list','📋','SAC'],['pend','✅','Verificar'],['dash','📊','Dashboard'],['rep','📝','Semanal'],['notif','🔔','Avisos'],['cfg','⚙️','Perfil']]};
function go(v,id){view=v;cur=id||null;render();scrollTo(0,0)}
function setLogo(f){if(!f)return;const r=new FileReader();r.onload=e=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,300/Math.max(i.width,i.height));c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);S.logoCliente=c.toDataURL('image/png');save();render();if(S.url&&S.user.planta)api({action:'logoCliente',planta:S.user.planta,data:S.logoCliente}).catch(()=>{})};i.src=e.target.result};r.readAsDataURL(f)}
function render(){
 $('#clv').innerHTML=S.logoCliente?`<img src="${S.logoCliente}">`:'+ Logo cliente';$('#cl').classList.toggle('has',!!S.logoCliente);
 if(!S.user.nombre&&view!=='cfg'){view='cfg'}
 const r=S.user.rol;$('#sub').textContent=S.user.nombre?`${S.user.nombre} · ${S.user.area||'Sin área'}${r!=='tecnico'?' ★'+r:''}${S.user.planta?' · '+empresaNom(S.user.planta):''}`:'Configura tu perfil';
 let navs=r==='gerencia'?NAVS.supervisor.filter(n=>['dash','rep','list','cfg'].includes(n[0])):NAVS[r]||NAVS.tecnico;if(S.user.admin&&S.url&&!navs.some(n=>n[0]==='adm'))navs=navs.concat([['adm','🏢','Clientes']]);
 $('#nav').innerHTML=navs.map(n=>`<button class="${view===n[0]?'on':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('');
 const un=S.notifs.filter(n=>!n.leida&&(n.para===r||n.para==='todos')).length;const nb=$('#nb');nb.textContent=un;nb.classList.toggle('hide',!un);
 const f={list:vList,new:vForm,det:vDet,pend:vPend,dash:vDash,rep:vRep,notif:vNotif,cfg:vCfg,adm:vAdm}[view];$('#app').innerHTML=f();
 if(view==='dash')drawDash();
}
// ===== Lista =====
function vList(){
 const est=['Todas','Abierta','En curso','Cerrada','Verificada','Vencidas'];
 let L=S.sacs.slice().reverse();
 if(S.user.rol==='tecnico'&&S.user.nombre)L=L.filter(s=>s.de===S.user.nombre||(S.user.email&&s.email===S.user.email)||s.para===S.user.nombre||s.tecnico===S.user.nombre);
 if(filtro==='Vencidas')L=L.filter(vencida);else if(filtro!=='Todas')L=L.filter(s=>s.estado===filtro);
 const pc=S.sacs.filter(s=>s.estado==='Cerrada'&&!s.solConf&&isSol(s));
 return (pc.length?`<div class="card" style="border-left:4px solid var(--acc,#e8702a)"><b>Esperan tu conformidad (${pc.length})</b><div class="meta">Toca cada SAC para confirmar que el trabajo quedó bien.</div></div>`+pc.map(card).join(''):'')+`<div class="chips">${est.map(e=>`<button class="${filtro===e?'on':''}" onclick="filtro='${e}';render()">${e}</button>`).join('')}</div>`+
 (L.length?L.map(card).join(''):'<div class="card meta">No hay SAC. Toca ➕ para crear la primera.</div>');
}
function card(s){return `<div class="card item p${s.prioridad}" onclick="go('det','${s.id}')"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><h3>${s.id} · ${esc(s.equipo)}</h3><span class="tag s-${s.estado}" style="height:fit-content">${s.estado}</span></div>
<div>${esc(s.descripcion).slice(0,110)}${s.descripcion.length>110?'…':''}</div>
<div class="meta">${esc(s.tipo)} · ${esc(s.planta)} · Límite ${s.fechaLimite}${vencida(s)?' · <b style="color:var(--bad)">VENCIDA</b>':''}</div></div>`}
// ===== Formulario nueva SAC (basado en OS-MANT-01) =====
function chipsHTML(id,opts,val){return `<input type="hidden" id="${id}" value="${esc(val||'')}"><div class="opts2">${opts.map(o=>`<button type="button" class="opt2${o===val?' on':''}" onclick="pickChip('${id}',this)">${o}</button>`).join('')}</div>`}
function pickChip(id,b){const h=$('#'+id);h.value=b.textContent;b.parentNode.querySelectorAll('.opt2').forEach(x=>x.classList.toggle('on',x===b));b.parentNode.style.outline='';if(id==='f_rep'){$('#f_repbox').style.display=h.value==='Sí'?'block':'none'}}
function vForm(){if(!SAC_NUEVAS)return '<div class="card"><h3 style="margin-top:0">⏸ Generación de SAC en pausa</h3><p>Por ahora no se pueden crear solicitudes nuevas. Las SAC ya registradas se pueden consultar, avanzar y cerrar.</p></div>';return `<div class="card"><h3 style="margin-top:0">Nueva SAC</h3>
<label>Planta / Industria</label><input id="f_planta" value="${esc(S.user.planta)}" list="pl"><datalist id="pl">${S.plantas.map(p=>`<option>${esc(p)}`).join('')}</datalist>
<div class="row"><div><label>De (solicitante)</label><input id="f_de" value="${esc(S.user.nombre)}"></div><div><label>Dpto.</label><input id="f_dpto"></div></div>
<label>Para (responsable)</label><input id="f_para" placeholder="Mantenimiento / nombre">
<label>Máquina, equipo o instalación</label><input id="f_eq">
<label>Tipo de solicitud</label><select id="f_tipo">${TIPOS.map(t=>`<option>${t}</option>`).join('')}</select>
<label>Prioridad</label><select id="f_pr">${Object.entries(PRIO).map(([k,v])=>`<option value="${k}" ${k==2?'selected':''}>${v.t}</option>`).join('')}</select>
<label>Describa el servicio / acción correctiva solicitada</label><textarea id="f_desc"></textarea>
<label>Fotos de la avería / hallazgo (cámara o galería, hasta 6)</label><input type="file" accept="image/*" multiple id="f_foto">
<label>¿Requiere repuestos o materiales?</label>${chipsHTML('f_rep',['No','Sí'],'No')}
<div id="f_repbox" style="display:none"><label>Plazo estimado de llegada del repuesto</label>${chipsHTML('f_replazo',['1-2 días','3-7 días','8-30 días','Mayor a 30 días'],'')}</div>
<button class="btn acc full" onclick="crear()">Enviar SAC</button></div>`}
function img1(file){return new Promise(res=>{const r=new FileReader();r.onload=e=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,1000/Math.max(i.width,i.height));c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.65))};i.onerror=()=>res('');i.src=e.target.result};r.onerror=()=>res('');r.readAsDataURL(file)})}
async function imgs(files){const o=[];for(const f of [...files].slice(0,6))o.push(await img1(f));return o.filter(Boolean)}
const FL=x=>Array.isArray(x)?x:(x?[x]:[]);
const gal=a=>FL(a).length?`<div class="gal">${FL(a).map(u=>`<img src="${u}" onclick="zoom(this.src)">`).join('')}</div>`:'';
function zoom(u){const d=document.createElement('div');d.className='lb';d.innerHTML=`<img src="${u}">`;d.onclick=()=>d.remove();document.body.appendChild(d)}
const rh=(t,sub,cls='')=>`<div class="rh ${cls}"><img src="${document.querySelector('header .lg').src}"><div><b>${t}</b><br><span class="meta">${sub}</span></div>${S.logoCliente?`<img src="${S.logoCliente}">`:'<span style="width:44px"></span>'}</div>`;
function crear(){if(!SAC_NUEVAS)return toast('La generación de SAC está en pausa');
 const eq=$('#f_eq').value.trim(),d=$('#f_desc').value.trim();if(!eq||!d)return toast('Completa equipo y descripción');const ciP=cliInfo($('#f_planta').value.trim());if(ciP&&(ciP.bloqueo||ciP.noCrea))return toast(ciP.bloqueo||ciP.noCrea);if($('#f_rep').value==='Sí'&&!$('#f_replazo').value)return toast('Indica el plazo estimado del repuesto');
 imgs($('#f_foto').files).then(foto=>{
  const pr=+$('#f_pr').value;const id='SAC-'+hoy().slice(2).replace(/-/g,'')+'-'+(100+Math.floor(Math.random()*900));const pl=$('#f_planta').value.trim()||'Planta 1';if(!S.plantas.includes(pl))S.plantas.push(pl);
  S.sacs.push({id,fecha:hoy(),planta:pl,de:$('#f_de').value.trim(),dpto:$('#f_dpto').value.trim(),para:$('#f_para').value.trim(),equipo:eq,tipo:$('#f_tipo').value,prioridad:pr,fechaLimite:addD(hoy(),PRIO[pr].d),descripcion:d,foto,repuestos:$('#f_rep').value==='Sí',repPlazo:$('#f_rep').value==='Sí'?$('#f_replazo').value:'',fechaSolRep:'',estado:'Abierta',tecnico:'',
  inicio:'',fin:'',personas:'',hNorm:'',hExtra:'',conforme:'',comentarios:'',verif:null,hist:[{f:new Date().toISOString(),u:S.user.nombre,a:'Creada'}]});
  notif('supervisor',`Nueva ${id} (${PRIO[pr].t.split(' ·')[0]==='1'?'URGENTE':'prioridad '+pr}): ${eq}`,id);S.sacs[S.sacs.length-1].email=S.user.email;enq(S.sacs[S.sacs.length-1]);toast(id+' creada');go('list')})
}
// ===== Detalle / avance / cierre =====
function vDet(){const s=S.sacs.find(x=>x.id===cur);if(!s)return'';const r=S.user.rol;
 let h=`<div class="noprint"><button class="btn ghost" onclick="go('list')">← Volver</button> <button class="btn acc" style="float:right" onclick="print()">📄 Exportar PDF</button></div><div class="card p${s.prioridad}" style="margin-top:8px">${rh('SOLICITUD DE ACCIÓN CORRECTIVA','Orden de servicio · '+esc(empresaNom(s.planta)),'pr-only')}<div class="row" style="justify-content:space-between;flex-wrap:nowrap"><h3 style="margin:0">${s.id}</h3><span class="tag s-${s.estado}">${s.estado}</span></div>
<p><b>${esc(s.equipo)}</b> · ${esc(s.tipo)} · ${esc(s.planta)}</p><p>${esc(s.descripcion)}</p>${FL(s.foto).length?`<div class="meta"><b>Evidencia de la avería</b></div>${gal(s.foto)}`:''}
<div class="meta">De: ${esc(s.de)} (${esc(s.dpto)}) → Para: ${esc(s.para)}<br>Emitida ${s.fecha} · Límite ${s.fechaLimite}${vencida(s)?' <b style="color:var(--bad)">VENCIDA</b>':''}<br>Repuestos: ${s.repuestos?'Sí'+(s.repPlazo?' · plazo '+esc(s.repPlazo):''):'No'}${s.inicio?`<br>Inicio ${s.inicio}`:''}${s.fin?` · Fin ${s.fin}`:''}${s.personas?`<br>${s.personas} pers. · ${s.hNorm||0} h normales + ${s.hExtra||0} h extras = <b>${(+s.hNorm||0)+(+s.hExtra||0)} h</b>`:''}${s.conforme?`<br>Conforme: ${s.conforme}`:''}${s.solConf?`<br>Conformidad del solicitante: <b>${s.solConf}</b> · ${s.solFecha} · ${esc(s.solPor)}${s.solObs?' · '+esc(s.solObs):''}`:''}${s.comentarios?`<br>Comentarios: ${esc(s.comentarios)}`:''}</div>${FL(s.fotoCierre).length?`<div class="meta" style="margin-top:8px"><b>Evidencia de culminación / cierre</b></div>${gal(s.fotoCierre)}`:''}</div>`;
 if(s.estado==='Abierta'||s.estado==='En curso'){
  h+=`<div class="card"><h3 style="margin-top:0">${s.estado==='Abierta'?'Tomar / reportar avance':'Reportar avance o cerrar'}</h3>
  <p class="meta"><b>Todos los campos con * son obligatorios.</b> Para cerrar la SAC también: fecha de terminación, foto y conformidad.</p><label>Técnico responsable *</label><input id="d_tec" value="${esc(s.tecnico||S.user.nombre)}">
  <div class="row"><div><label>Fecha real de inicio *</label><input type="date" id="d_ini" value="${s.inicio||hoy()}"></div><div><label>Fecha de terminación * (para cerrar)</label><input type="date" id="d_fin" value="${s.fin||''}"></div></div>
  <div class="row"><div><label>Cant. personas *</label><input type="number" id="d_per" value="${s.personas}"></div><div><label>Hrs normales *</label><input type="number" id="d_hn" value="${s.hNorm}"></div><div><label>Hrs extras * (0 si no hubo)</label><input type="number" id="d_he" value="${s.hExtra}"></div></div>
  <label>Comentarios / avance *</label><textarea id="d_com">${esc(s.comentarios)}</textarea>
  <label>Fotos de evidencia / culminación (cámara o galería, hasta 6) * (para cerrar)</label><input type="file" accept="image/*" multiple id="d_foto">
  <label>Servicio ejecutado conforme * (para cerrar)</label>${chipsHTML('d_conf',['Sí','No'],'')}
  <div id="d_err" class="meta" style="color:var(--bad,#c0392b);font-weight:700;margin-top:8px"></div>
  <div class="row"><button class="btn full" onclick="avance('${s.id}',false)">Guardar avance</button><button class="btn ok full" onclick="avance('${s.id}',true)">Cerrar SAC</button></div></div>`}
 if(s.estado==='Cerrada'&&!s.solConf&&isSol(s)){h+=`<div class="card"><h3 style="margin-top:0">Conformidad del solicitante</h3><p class="meta">Tú pediste este trabajo. Confirma si lo recibiste conforme. Si no estás conforme, la SAC se reabre.</p><label>Observaciones (obligatorias si no estás conforme)</label><textarea id="sc_obs"></textarea><div class="row"><button class="btn ok full" onclick="conformeSol('${s.id}',true)">✔ Conforme</button><button class="btn bad full" onclick="conformeSol('${s.id}',false)">✖ No conforme (reabrir)</button></div></div>`}
 if(s.estado==='Cerrada'&&r!=='tecnico'){h+=`<div class="card"><h3 style="margin-top:0">Verificación del supervisor</h3><p class="meta">Verifica en sitio la ejecución y valida con QC.</p>${s.solConf?'':`<p class="meta"><b>Falta la conformidad del solicitante (${esc(s.de)}).</b></p>`}
  <label>Verificado por QC (nombre)</label><input id="v_qc"><label>Observaciones</label><textarea id="v_obs"></textarea>
  <div class="row"><button class="btn ok full" onclick="verif('${s.id}',true)">✔ Verificada y validada QC</button><button class="btn bad full" onclick="verif('${s.id}',false)">✖ Rechazar (reabrir)</button></div></div>`}
 if(s.verif)h+=`<div class="card"><b>Verificación:</b> ${s.verif.ok?'✔ Aprobada':'✖ Rechazada'} · ${s.verif.fecha} · Sup: ${esc(s.verif.sup)} · QC: ${esc(s.verif.qc)}<br>${esc(s.verif.obs)}</div>`;
 h+=`<div class="card"><b>Historial</b><div class="tl">${s.hist.map(e=>`<div>${e.f.slice(0,16).replace('T',' ')} · <b>${esc(e.u)}</b> · ${esc(e.a)}</div>`).join('')}</div></div>`;return h}
function isSol(s){const em=(S.user.email||'').toLowerCase();return !!((em&&s.email&&String(s.email).toLowerCase()===em)||(!s.email&&S.user.nombre&&s.de===S.user.nombre))}
function conformeSol(id,ok){const s=S.sacs.find(x=>x.id===id);const obs=$('#sc_obs').value.trim();if(!ok&&!obs)return toast('Explica por qué no estás conforme');
 Object.assign(s,{solConf:ok?'Sí':'No',solFecha:hoy(),solPor:S.user.nombre,solObs:obs});
 hist(s,ok?'Conformidad del solicitante: Sí':'Solicitante NO conforme: '+obs);
 if(ok){notif('supervisor',`${s.id}: el solicitante confirmó su conformidad. Verificar y validar con QC`,s.id);toast('Gracias, conformidad registrada')}
 else{s.estado='En curso';notif('supervisor',`${s.id}: solicitante NO conforme, reabierta: ${obs}`,s.id);notif('tecnico',`${s.id}: el solicitante NO quedó conforme, reabierta: ${obs}`,s.id);toast('SAC reabierta')}
 enq(s);go('det',id)}
function validarAvance(s,cerrar){const v=i=>String($('#'+i).value||'').trim(),falta=[],ids=[];
 const req=(i,n)=>{if(v(i)===''){falta.push(n);ids.push(i)}};
 const mk=(i,on)=>{const e=$('#'+i);if(!e)return;const t=e.type==='hidden'?e.nextElementSibling:e;if(t){t.style.borderColor=on?'var(--bad)':'';t.style.outline=on?'2px solid var(--bad)':''}};
 ['d_tec','d_ini','d_per','d_hn','d_he','d_com','d_fin','d_conf','d_foto'].forEach(i=>mk(i,false));
 req('d_tec','Técnico responsable');req('d_ini','Fecha de inicio');req('d_per','Cantidad de personas');req('d_hn','Horas normales');req('d_he','Horas extras (poné 0 si no hubo)');req('d_com','Comentarios / avance');
 if(cerrar){req('d_fin','Fecha de terminación');if(!FL(s.fotoCierre).length&&!$('#d_foto').files.length){falta.push('Foto de evidencia / culminación');ids.push('d_foto')}req('d_conf','Servicio ejecutado conforme')}
 const bad=(i,n,min)=>{if(v(i)!==''&&(isNaN(+v(i))||+v(i)<min)){falta.push(n);ids.push(i)}};
 bad('d_per','Cantidad de personas (mínimo 1)',1);bad('d_hn','Horas normales (número desde 0)',0);bad('d_he','Horas extras (número desde 0)',0);
 if(v('d_ini')&&v('d_fin')&&v('d_fin')<v('d_ini')){falta.push('La fecha de terminación no puede ser anterior al inicio');ids.push('d_fin')}
 ids.forEach(i=>mk(i,true));
 const msg=falta.length?'Falta completar: '+falta.join(' · '):'';$('#d_err').textContent=msg;
 if(msg){toast(msg);const f0=$('#'+ids[0]);const f=f0&&f0.type==='hidden'?f0.nextElementSibling:f0;if(f&&f.scrollIntoView)f.scrollIntoView({block:'center'})}
 return !msg}
function avance(id,cerrar){const s=S.sacs.find(x=>x.id===id);const bq=bloqueoDe(s.planta);if(bq)return toast(bq);if(!validarAvance(s,cerrar))return;
 const fin=()=>imgs($('#d_foto').files).then(foto=>{
  Object.assign(s,{tecnico:$('#d_tec').value.trim(),inicio:$('#d_ini').value,fin:$('#d_fin').value,personas:$('#d_per').value,hNorm:$('#d_hn').value,hExtra:$('#d_he').value,comentarios:$('#d_com').value.trim()});
  if(foto.length)s.fotoCierre=FL(s.fotoCierre).concat(foto);
  if(cerrar){if(!$('#d_conf').value)return toast('Indica si quedó conforme');s.conforme=$('#d_conf').value;if(!s.fin)s.fin=hoy();s.estado='Cerrada';s.solConf='';s.solFecha='';s.solPor='';s.solObs='';hist(s,'Cerrada por técnico (conforme: '+s.conforme+')');
   notif('supervisor',`${s.id} CERRADA por ${s.tecnico||S.user.nombre}: verificar en sitio y validar con QC`,s.id);toast('SAC cerrada. Se avisó al supervisor');}
  else{s.estado='En curso';hist(s,'Avance: '+(s.comentarios||'sin comentario').slice(0,80));toast('Avance guardado')}
  enq(s);go('det',id)});fin()}
function verif(id,ok){const s=S.sacs.find(x=>x.id===id);const bq=bloqueoDe(s.planta);if(bq)return toast(bq);const qc=$('#v_qc').value.trim();if(ok&&!qc)return toast('Indica quién de QC valida');
 if(ok&&s.solConf!=='Sí'){if(!S.user.admin)return toast('Falta la conformidad del solicitante');if(!confirm('El solicitante ('+s.de+') aún no confirmó su conformidad. ¿Verificar de todos modos?'))return;hist(s,'Verificada SIN conformidad del solicitante (autorizó '+S.user.nombre+')')}
 s.verif={ok,sup:S.user.nombre,qc,obs:$('#v_obs').value.trim(),fecha:hoy()};s.estado=ok?'Verificada':'En curso';s.hist.push({f:new Date().toISOString(),u:S.user.nombre,a:ok?'Verificada con QC: '+qc:'Rechazada: '+s.verif.obs});
 notif('tecnico',ok?`${s.id} verificada ✔`:`${s.id} RECHAZADA, reabierta: ${s.verif.obs}`,s.id);enq(s);go('pend')}
function hist(s,a){s.hist.push({f:new Date().toISOString(),u:S.user.nombre,a})}
function vPend(){const L=S.sacs.filter(s=>s.estado==='Cerrada');return `<h3>Pendientes de verificación (${L.length})</h3>`+(L.length?L.map(card).join(''):'<div class="card meta">Nada por verificar 👌</div>')}
// ===== Notificaciones =====
function notif(para,msg,id){S.notifs.unshift({para,msg,id,f:new Date().toISOString(),leida:false});
 try{if('Notification'in window&&Notification.permission==='granted'&&S.user.rol===para)new Notification('SAC',{body:msg})}catch(e){}}
function vNotif(){const r=S.user.rol;const L=S.notifs.filter(n=>n.para===r||n.para==='todos');
 setTimeout(()=>{L.forEach(n=>n.leida=true);save();const nb=$('#nb');nb.classList.add('hide')},800);
 return `<h3>Avisos</h3>${L.length?L.map(n=>`<div class="card item" onclick="go('det','${n.id}')" style="${n.leida?'':'border-color:var(--acc)'}">${esc(n.msg)}<div class="meta">${n.f.slice(0,16).replace('T',' ')}</div></div>`).join(''):'<div class="card meta">Sin avisos</div>'}
 <div class="card noprint meta">Los avisos en el teléfono llegan push cuando se conecte el servidor (siguiente fase). Mientras tanto, al cerrar una SAC puedes enviar el aviso por WhatsApp:</div>`}
function wa(id){const s=S.sacs.find(x=>x.id===id);open('https://wa.me/?text='+encodeURIComponent(`SAC ${s.id} CERRADA - ${s.equipo} (${s.planta}). Por favor verificar en sitio y validar con QC.`))}
// ===== Dashboard =====
function stats(a,b){const L=S.sacs.filter(s=>(!a||s.fecha>=a)&&(!b||s.fecha<=b));const cerr=S.sacs.filter(s=>s.estado==='Verificada'||s.estado==='Cerrada');
 const t=cerr.filter(s=>s.fin).map(s=>dias(s.fecha,s.fin));return{L,total:L.length,abiertas:S.sacs.filter(s=>s.estado==='Abierta').length,curso:S.sacs.filter(s=>s.estado==='En curso').length,porVerif:S.sacs.filter(s=>s.estado==='Cerrada').length,verif:S.sacs.filter(s=>s.estado==='Verificada').length,venc:S.sacs.filter(vencida).length,prom:t.length?(t.reduce((x,y)=>x+y,0)/t.length).toFixed(1):'–',horas:S.sacs.reduce((x,s)=>x+(+s.hNorm||0)+(+s.hExtra||0),0)}}
function count(L,k){const m={};L.forEach(s=>m[s[k]]=(m[s[k]]||0)+1);return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function bars(e){const mx=Math.max(1,...e.map(x=>x[1]));return e.map(x=>`<div class="bar"><em>${esc(x[0])}</em><i style="width:${x[1]/mx*55}%"></i>${x[1]}</div>`).join('')||'<span class="meta">Sin datos</span>'}
// ===== Dashboard técnico (SVG propio, sin librerías) =====
const isC=s=>s.estado==='Cerrada'||s.estado==='Verificada';
const cd=s=>isC(s)&&s.fin?s.fin:null;
const dow=s=>new Date(s+'T00:00:00Z').getUTCDay();
const monOf=s=>addD(s,dow(s)===0?-6:1-dow(s));
const bk=s=>dow(s)===0?addD(s,-1):s; // el domingo se suma al sábado
const ddmm=s=>s.slice(8)+'/'+s.slice(5,7);
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const addM=(ym,n)=>{const[y,m]=ym.split('-').map(Number),t=y*12+m-1+n;return Math.floor(t/12)+'-'+String(t%12+1).padStart(2,'0')};
const DL=['L','M','M','J','V','S'];
const tx=(x,y,t,o='')=>`<text x="${x}" y="${y}" ${o}>${t}</text>`;
function lr(p){const n=p.length;if(n<2)return null;let sx=0,sy=0,sxy=0,sxx=0;p.forEach(q=>{sx+=q.x;sy+=q.y;sxy+=q.x*q.y;sxx+=q.x*q.x});const d=n*sxx-sx*sx;if(!d)return null;const m=(n*sxy-sx*sy)/d;return{m,b:(sy-m*sx)/n}}
const arrow=m=>m>0.05?'▲':m<-0.05?'▼':'►';
const legend=a=>`<div class="leg">${a.map(x=>`<span>${x[2]||'<i style="background:'+x[1]+'"></i>'}${x[0]}</span>`).join('')}</div>`;
const dash=c=>`<svg width="18" height="8" style="vertical-align:middle;margin-right:4px"><line x1="0" x2="18" y1="4" y2="4" stroke="${c}" stroke-width="2.2" stroke-dasharray="4 3"/></svg>`;
const line=c=>`<svg width="18" height="8" style="vertical-align:middle;margin-right:4px"><line x1="0" x2="18" y1="4" y2="4" stroke="${c}" stroke-width="2.4"/></svg>`;

// ---- Estilo 3D: degradados, barras extruidas, etiquetas con relieve y sombras ----
const C3={acc:['#ffa066','#e8702a','#b3501a'],ok:['#6fd49a','#2e9e5b','#1f7a43'],pri:['#8bb6ea','#3b82c4','#26588f'],bad:['#ff8a8a','#d64545','#a02f2f'],warn:['#ffd45e','#e0a100','#a87800']};
const defs3=()=>'<defs><filter id="sh" x="-30%" y="-30%" width="170%" height="170%"><feDropShadow dx="1.5" dy="3" stdDeviation="2" flood-color="#000" flood-opacity=".38"/></filter><filter id="sh2" x="-10%" y="-10%" width="125%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f3a5f" flood-opacity=".25"/></filter>'+
 Object.entries(C3).map(([k,[a,b,c]])=>'<linearGradient id="g_'+k+'" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="'+a+'"/><stop offset=".5" stop-color="'+b+'"/><stop offset="1" stop-color="'+c+'"/></linearGradient><linearGradient id="gv_'+k+'" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="'+a+'"/><stop offset="1" stop-color="'+c+'"/></linearGradient>').join('')+
 '<linearGradient id="gb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8702a"/><stop offset="1" stop-color="#3b82c4"/></linearGradient><linearGradient id="gp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><radialGradient id="gs" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#9cc4f2"/><stop offset="1" stop-color="#26588f"/></radialGradient></defs>';
const bar3d=(x,y,w,hh,k,d=6)=>{if(hh<1)return'';const e=d*.7,c=C3[k];return '<g filter="url(#sh)"><polygon points="'+x+','+y+' '+(x+d)+','+(y-e)+' '+(x+w+d)+','+(y-e)+' '+(x+w)+','+y+'" fill="'+c[0]+'"/><polygon points="'+(x+w)+','+y+' '+(x+w+d)+','+(y-e)+' '+(x+w+d)+','+(y+hh-e)+' '+(x+w)+','+(y+hh)+'" fill="'+c[2]+'"/><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+hh+'" fill="url(#g_'+k+')"/><rect x="'+(x+w*.14)+'" y="'+y+'" width="'+(w*.14)+'" height="'+hh+'" fill="#fff" opacity=".28"/></g>'};
const badge=(cx,y,t,k)=>{t=String(t);const w=t.length*6.4+10;return '<g filter="url(#sh)"><rect x="'+(cx-w/2)+'" y="'+y+'" width="'+w+'" height="15" rx="7.5" fill="url(#gv_'+k+')" stroke="#fff" stroke-opacity=".7" stroke-width="1"/><rect x="'+(cx-w/2+2)+'" y="'+(y+1)+'" width="'+(w-4)+'" height="6" rx="3" fill="url(#gp)"/></g><text x="'+cx+'" y="'+(y+11)+'" text-anchor="middle" font-size="10" font-weight="800" fill="#fff" style="paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:.8px">'+t+'</text>'};
const sphere=(x,y,r=4)=>'<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="url(#gs)" stroke="#fff" stroke-width="1" filter="url(#sh)"/>';

// Gráfico único: 3 meses | semanas del mes | semana en curso Lun–Dom (avance diario, se actualiza sola)
function chartUnified(){
 const T=hoy(),cm=monOf(T),ym0=T.slice(0,7);
 const between=(f,a,b)=>S.sacs.filter(s=>{const v=f(s);return v&&v>=a&&v<=b}).length;
 const mo=[-2,-1,0].map(n=>addM(ym0,n)).map(ym=>({l:MES[+ym.slice(5)-1].toUpperCase()+' '+ym.slice(2,4),n:between(s=>s.fecha,ym+'-01',ym+'-31'),c:between(cd,ym+'-01',ym+'-31')}));
 let w0=monOf(ym0+'-01');if(w0<ym0+'-01')w0=addD(w0,7);const wk=[];for(let w=w0;w.slice(0,7)===ym0;w=addD(w,7))wk.push({l:'S'+(wk.length+1)+' '+ddmm(w),fut:w>T,n:between(s=>s.fecha,w,addD(w,6)),c:between(cd,w,addD(w,6))});
 const days=[0,1,2,3,4,5,6].map(i=>{const d=addD(cm,i);return{i,d,fut:d>T,n:between(s=>s.fecha,d,d),c:between(cd,d,d)}});
 let cum=0;days.forEach(x=>{if(!x.fut){cum+=x.c;x.cum=cum}});
 const W=900,H=370,Tp=78,B=46,ph=H-Tp-B;let g=defs3();
 const frame=(x0,w,t,sub,live)=>{g+='<rect x="'+x0+'" y="8" width="'+w+'" height="'+(H-16)+'" rx="16" fill="var(--card)" stroke="url(#gb)" stroke-width="2.2" filter="url(#sh2)"/><rect x="'+(x0+3)+'" y="11" width="'+(w-6)+'" height="'+((H-16)/2.4)+'" rx="14" fill="url(#gp)" opacity=".35"/>'+tx(x0+w/2,30,t,'text-anchor="middle" font-size="12.5" font-weight="800" fill="var(--tx)"')+tx(x0+w/2,45,sub,'text-anchor="middle" font-size="9.5" fill="'+(live?'#2e9e5b':'var(--mut)')+'"')};
 const grid=(x0,w,mx,col)=>{for(let i=0;i<=4;i++){const y=Tp+ph*(1-i/4);g+='<line x1="'+(x0+20)+'" x2="'+(x0+w-8)+'" y1="'+y+'" y2="'+y+'" stroke="var(--bd)" stroke-dasharray="2 4"/>'+tx(x0+16,y+3,Math.round(mx*i/4),'text-anchor="end" font-size="9" fill="'+(col||'var(--mut)')+'"')}
  g+='<polygon points="'+(x0+14)+','+(Tp+ph+6)+' '+(x0+w-4)+','+(Tp+ph+6)+' '+(x0+w+2)+','+(Tp+ph)+' '+(x0+20)+','+(Tp+ph)+'" fill="var(--mut)" opacity=".35"/>'};
 const bars=(x0,w,items,mx,cats)=>{const sw=(w-28)/items.length,Y=v=>Tp+ph*(1-v/mx),bw=Math.min(26,sw*.32);items.forEach((m,i)=>{const cx=x0+20+sw*i+sw/2;
  if(!m.fut){[[m.n,'acc',cx-bw-3],[m.c,'ok',cx+1]].forEach(([v,k,x])=>{g+=bar3d(x,Y(v),bw,Y(0)-Y(v),k)+(v?badge(x+bw/2+3,Y(v)-24,v,k):'')})}
  g+=tx(cx,H-22,cats(m,i),'text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--tx)"'+(m.fut?' opacity=".35"':''))})};
 const tl=items=>{const pt=k=>lr(items.map((m,i)=>({x:i,y:m[k]})).filter((_,i)=>!items[i].fut));return{n:pt('n'),c:pt('c')}};
 const sl=(items,u)=>{const t=tl(items).c;return t&&items.filter(m=>!m.fut).length>1?' · cierres '+arrow(t.m)+(t.m>0?'+':'')+t.m.toFixed(1)+'/'+u:''};

 <label>Correo(s) del reporte semanal</label><input id="${id('cr')}" value="${esc(c?c.reporteEmails:'')}">
 <div class="row"><button class="btn full" onclick="saveCli(${c?i:-1})">Guardar</button>${c&&S.user.dueno?`<button class="btn ${c.activo?'bad':'ok'} full" onclick="toggleCli(${i})">${c.activo?'⛔ Inhabilitar':'✅ Habilitar'}</button>`:''}</div></div>`}
const vAdm=()=>S.user.admin?`<h3>Clientes y acuerdos</h3><div class="meta" style="margin-bottom:8px">Configura cada cliente: empresa, quién genera solicitudes y desde cuándo se habilita la herramienta.${S.user.dueno?' «Inhabilitar» cancela las operaciones de un cliente sin acuerdo vigente.':''}</div>${(S.cfg||[]).map((c,i)=>cfgForm(c,i)).join('')}${cfgForm(null,-1)}`:'';
async function saveCli(i){const c=i>=0?S.cfg[i]:null,id=k=>'#'+k+i,cliente=c?c.cliente:val(id('cn'));if(!cliente)return toast('Escribe el nombre del cliente');
 try{const r=await api({action:'cfgCliente',email:S.user.email,cliente,data:{empresa:val(id('ce')),solicitantes:val(id('cs')),habilitadoDesde:val(id('cd')),supervisorEmail:val(id('cv')),qcEmail:val(id('cq')),reporteEmails:val(id('cr'))}});if(r.error)return toast(r.error);toast('Guardado');await pull();render()}catch(e){toast('No se pudo guardar')}}
async function toggleCli(i){const c=S.cfg[i];if(!confirm(c.activo?'¿Inhabilitar a '+c.cliente+'? Se bloquean nuevas solicitudes, avances y cierres, y se suspenden avisos y reportes.':'¿Habilitar de nuevo a '+c.cliente+'?'))return;
 try{const r=await api({action:'estadoCliente',email:S.user.email,cliente:c.cliente,activo:!c.activo});if(r.error)return toast(r.error);toast(c.activo?'Cliente inhabilitado':'Cliente habilitado');await pull();render()}catch(e){toast('No se pudo cambiar el estado')}}
// ===== Sincronización con Google (Apps Script) =====
const api=p=>fetch(S.url,{method:'POST',body:JSON.stringify(p),headers:{'Content-Type':'text/plain'}}).then(r=>r.json());
function enq(s){S.queue=(S.queue||[]).filter(o=>o.sac.id!==s.id);S.queue.push({action:'upsert',sac:JSON.parse(JSON.stringify(s))});save();render();flush()}
let busy=false;
async function flush(){if(!S.url||busy||!navigator.onLine)return;busy=true;try{while(S.queue.length){const r=await api(S.queue[0]);if(r.error){if(r.bloqueado){toast(r.error);S.queue.shift();save();continue}throw r.error}S.queue.shift();save()}await pull()}catch(e){console.warn('sync',e)}busy=false}
function syncAvisos(){S.nseen=S.nseen||{};const rec=d=>d&&d>=addD(hoy(),-7);const gest=!!(S.user.admin||S.user.rol==='supervisor'||S.user.rol==='gerencia');
 const add=(k,msg,id)=>{if(S.nseen[k])return;S.nseen[k]=1;notif('todos',msg,id)};
 S.sacs.forEach(s=>{
  if(s.estado==='Cerrada'&&!s.solConf&&rec(s.fin)){
   if(isSol(s))add(s.id+'|cierre|'+s.fin,`${s.id} cerrada (${s.equipo}): confirma si quedó conforme el servicio`,s.id);
   else if(gest)add(s.id+'|gest|'+s.fin,`${s.id} cerrada por ${s.tecnico||'el técnico'} (conforme: ${s.conforme||'-'}). Falta la conformidad de ${s.de}`,s.id)}
  if(s.solConf&&rec(s.solFecha)&&gest)add(s.id+'|sol|'+s.solFecha+s.solConf,`${s.id}: ${s.de} ${s.solConf==='Sí'?'dio su CONFORMIDAD':'NO está conforme'}${s.solObs?' · '+s.solObs:''}`,s.id)})}
async function pull(){if(!S.url)return;try{const r=await fetch(S.url+'?email='+encodeURIComponent(S.user.email||'')+'&nombre='+encodeURIComponent(S.user.nombre||'')).then(x=>x.json());if(!r.ok)return;
 const pend=new Set((S.queue||[]).map(o=>o.sac.id));const loc=S.sacs.filter(s=>pend.has(s.id));S.sacs=r.sacs.filter(s=>!pend.has(s.id)).concat(loc);
 S.user.rol=r.nivel;S.user.admin=!!r.admin;if(S.user.area==='Gerencia'&&S.user.rol==='tecnico')S.user.rol='gerencia';r.clientes.forEach(c=>{if(!S.plantas.includes(c.cliente))S.plantas.push(c.cliente);if(c.cliente===S.user.planta&&c.logo)S.logoCliente=c.logo});S.cli=r.clientes;S.cfg=r.cfg||[];S.user.dueno=!!r.dueno;
 if(!r.logoLT){const lt=document.querySelector('header .lg').src;if(lt.startsWith('data:'))api({action:'logoLT',data:lt})}
 syncAvisos();save();const ae=document.activeElement;if(view!=='cfg'&&view!=='new'&&view!=='adm'&&!(ae&&ae.matches&&ae.matches('input,textarea,select')))render()}catch(e){console.warn('pull',e)}}
/*auto-dash*/setInterval(()=>{if(view==='dash')render()},60000);addEventListener('online',flush);setInterval(()=>S.url&&(S.queue.length?flush():pull()),60000);
if(location.hash.length>4){setTimeout(()=>{if(S.sacs.find(s=>s.id===location.hash.slice(1)))go('det',location.hash.slice(1))},1500)}
// ===== Arranque =====
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();pull();
</script>
</body>
</html>
